[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../../node_modules", "../../lib"]
remappings = [
    "@openzeppelin/=../../node_modules/@openzeppelin/",
    "forge-std/=../../lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"

[lint]
lint_on_build = false
